name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Build Flet APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}
      - name: Upload compiled Android application
        uses: actions/upload-artifact@v7
        with:
          name: SMS-TEST-v3.1-Android
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
